<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161D27" />
      <stop offset="50%" stop-color="#0E131A" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8C7" />
      <stop offset="25%" stop-color="#F5BA72" />
      <stop offset="70%" stop-color="#E39A5E" />
      <stop offset="100%" stop-color="#BA6520" />
    </linearGradient>

    <!-- Cyan AI Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#4FD3A4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Refined Border Stroke -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 186, 114, 0.75)" />
      <stop offset="60%" stop-color="rgba(227, 154, 94, 0.25)" />
      <stop offset="100%" stop-color="rgba(79, 211, 164, 0.35)" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter for Vector -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#E39A5E" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Luxury Obsidian Squircle Base -->
  <rect x="5" y="5" width="118" height="118" rx="32" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2.5" />

  <!-- Ambient Glow Behind Icon -->
  <circle cx="64" cy="64" r="36" fill="#E39A5E" opacity="0.12" />

  <!-- FinAI Dynamic Monogram & Growth Vector -->
  <g filter="url(#softGlow)">
    <!-- Vertical Stem of F -->
    <rect x="36" y="30" width="16" height="68" rx="8" fill="url(#goldGrad)" />
    
    <!-- Top Horizontal Wing of F with forward arrow cut -->
    <path d="M 44 30 L 88 30 C 92 30 95 33 93.5 36.8 L 90 45 C 89 47.5 86.5 49 84 49 L 44 49 Z" fill="url(#goldGrad)" />

    <!-- Middle Horizontal Branch of F -->
    <path d="M 44 57 L 76 57 C 79 57 81 59 80 62 L 77.5 69 C 76.8 71 74.8 72.5 72.5 72.5 L 44 72.5 Z" fill="url(#goldGrad)" />

    <!-- Upward Financial Growth Pulse (Arrow/Wave) -->
    <path d="M 68 94 L 78 83 L 87 88 L 97 73" fill="none" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrowhead Tip -->
    <path d="M 91 73 L 97 73 L 97 79" fill="none" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing AI Diamond / Sparkle at Upper Right -->
  <circle cx="94" cy="30" r="5" fill="#4FD3A4" />
  <circle cx="94" cy="30" r="2.5" fill="#FFFFFF" />
</svg>